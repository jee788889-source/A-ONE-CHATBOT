services:
  db:
    image: postgres:16-alpine
    container_name: aone-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aone_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aone_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-aone_restaurant}
    volumes:
      - aone_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aone_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aone-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aone_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aone-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-aone_user}:${POSTGRES_PASSWORD:-aone_secure_password}@db:5432/${POSTGRES_DB:-aone_restaurant}?schema=public
      REDIS_URL: redis://redis:6379
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@aonefoods.com}
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  aone_pgdata:
  aone_redisdata:
